<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="نقطة البيع">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/icon-192.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/icon-192.svg">
    <title>X METAL - نقطة البيع</title>
    <link rel="stylesheet" href="css/mobile-sales.css">
</head>
<body>
    <div class="splash-screen" id="splashScreen" aria-label="جاري تشغيل نقطة البيع">
        <div class="splash-mark">XM</div>
        <strong>نقطة البيع</strong>
        <span>جاري التجهيز...</span>
    </div>
    <div class="login-screen" id="loginScreen" hidden>
        <div class="login-card">
            <div class="brand-mark">XM</div>
            <h1>نقطة البيع</h1>
            <p>سجّل الدخول للبدء</p>
            <form id="loginForm" autocomplete="on">
                <label for="email">البريد الإلكتروني</label>
                <input id="email" type="email" autocomplete="username" required>
                <label for="password">كلمة المرور</label>
                <input id="password" type="password" autocomplete="current-password" required>
                <button class="primary-button" type="submit">دخول</button>
                <p class="form-error" id="loginError" role="alert"></p>
            </form>
        </div>
    </div>

    <main class="app-shell" id="appShell" hidden>
        <header class="topbar">
            <div>
                <span class="eyebrow">X METAL</span>
            </div>
        </header>

        <section class="toolbar" aria-label="البحث في المنتجات">
            <label class="search-box">
                <span class="search-icon" aria-hidden="true">⌕</span>
                <input id="productSearch" type="search" placeholder="ابحث عن منتج" autocomplete="off">
                <span class="product-count" id="productCount">جاري تحميل المنتجات...</span>
            </label>
            <button class="history-button" id="historyButton" type="button" aria-label="فتح السجل">السجل</button>
        </section>

        <section class="products-grid" id="productsGrid" aria-live="polite"></section>
        <div class="empty-state" id="productsEmpty" hidden>لا توجد منتجات متاحة</div>
    </main>

    <div class="modal-backdrop" id="saleModal" hidden>
        <section class="modal" role="dialog" aria-modal="true" aria-labelledby="saleModalTitle">
            <button class="close-button" data-close-modal="saleModal" type="button" aria-label="إغلاق">×</button>
            <p class="eyebrow">تسجيل بيع</p>
            <h2 id="saleModalTitle">بيع منتج</h2>
            <p class="modal-product" id="saleProductName"></p>
            <form id="saleForm">
                <div class="quantity-label-row"><label for="saleQuantity">الكمية</label><span class="available-stock" id="availableStock" aria-live="polite"></span></div>
                <input id="saleQuantity" type="number" min="0.01" step="any" required>
                <p class="quantity-warning" id="quantityWarning" role="alert" hidden></p>
                <div class="quick-quantity-row" id="quickQuantityButtons" aria-label="كميات سريعة">
                    <button type="button" data-quick-quantity="1">1</button><button type="button" data-quick-quantity="2">2</button><button type="button" data-quick-quantity="3">3</button><button type="button" data-quick-quantity="4">4</button><button type="button" data-quick-quantity="5">5</button><button type="button" data-quick-quantity="6">6</button><button type="button" data-quick-quantity="7">7</button><button type="button" data-quick-quantity="8">8</button><button type="button" data-quick-quantity="9">9</button><button type="button" data-quick-quantity="10">10</button>
                </div>
                <div class="price-fields-row">
                    <div class="price-field"><label for="salePrice">إجمالي سعر البيع <span id="saleCurrencyLabel"></span></label><input id="salePrice" type="number" min="0" step="any" required></div>
                    <div class="price-field"><label for="saleUnitPrice">سعر القطعة الواحدة</label><input id="saleUnitPrice" type="text" readonly aria-readonly="true"></div>
                </div>
                <p class="input-hint">يُحسب الإجمالي تلقائيًا من سعر البيع الأساسي عند تغيير الكمية، ويتوقف ذلك بعد تعديل السعر يدويًا.</p>
                <button class="reset-price-button" id="resetSalePrice" type="button">إعادة السعر الأساسي</button>
                <p class="calculated-total" id="calculatedTotal">الإجمالي: 0</p>
                <button class="primary-button" type="submit">تأكيد البيع</button>
                <p class="form-error" id="saleError" role="alert"></p>
                <div class="price-warning" id="priceWarning" hidden><strong id="priceWarningTitle">تنبيه السعر</strong><span id="priceWarningText"></span><div class="warning-actions"><button class="warning-back" id="backFromWarning" type="button">العودة لتعديل السعر</button><button class="warning-confirm" id="confirmUnusualPrice" type="button">متابعة البيع</button></div></div>
            </form>
        </section>
    </div>

    <div class="modal-backdrop" id="historyModal" hidden>
        <section class="modal history-modal" role="dialog" aria-modal="true" aria-labelledby="historyTitle">
            <button class="close-button" data-close-modal="historyModal" type="button" aria-label="إغلاق">×</button>
            <p class="eyebrow">عمليات هذه الصفحة فقط</p>
            <h2 id="historyTitle">السجل</h2>
            <div id="salesHistory" class="sales-history" aria-live="polite"></div>
        </section>
    </div>

    <div class="toast" id="toast" role="status"></div>
    <button class="install-button" id="installButton" type="button">تثبيت التطبيق</button>
    <button class="back-to-top" id="backToTop" type="button" aria-label="العودة إلى أعلى المنتجات">↑</button>
    <div class="custom-scrollbar" id="customScrollbar" role="scrollbar" aria-label="شريط تمرير الصفحة" aria-controls="appShell" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" hidden>
        <div class="custom-scrollbar-thumb" id="customScrollbarThumb"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/mobile-sales.js"></script>
</body>
</html>
